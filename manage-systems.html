<style>body{font-family:system-ui,sans-serif;background:#f1f5f8;color:#0b1824;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.7}section{background:white;padding:1.2rem;border-radius:12px;margin:1rem 0}label{display:block;margin:.7rem 0}input,select,button{font:inherit;padding:.6rem;border:1px solid #8797a3;border-radius:7px;max-width:100%;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;background:#0e7c86;color:white;border:0;margin:.3rem}button.secondary{background:#223a4d}button.danger{background:#b42318}.line{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.line strong{flex:1;overflow-wrap:anywhere}.muted{color:#5a6b78}.status{white-space:pre-wrap} [hidden]{display:none!important}.line[draggable=true]{cursor:grab}.line.dragging{opacity:.4}.line.drop,.zone-head.drop{outline:2px dashed #2aa8b0;outline-offset:2px}.zone-head{padding:4px 0}
