# ADR-0107 — publishes the website from the app's own files only (scripts/build-site.mjs); the repository's documentation,
# tests and scripts are not served. Also puts the latest Mail Extractor on the site, so its download works for everyone.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: node scripts/build-site.mjs
      - name: The latest Mail Extractor, from the repository's releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag=$(gh release list --limit 30 --json tagName -q '[.[] | select(.tagName | startswith("extractor-v"))][0].tagName')
          mkdir -p _site/assets/extractor
          gh release download "$tag" --pattern 'AFAQY-Mail-Extractor-win64.zip*' --dir _site/assets/extractor
          # the release's checksum file is written on Windows: the hash alone, in capitals, with a CRLF — compare the hashes directly
          cd _site/assets/extractor
          want=$(tr -d '\r\n \t' < AFAQY-Mail-Extractor-win64.zip.sha256 | cut -c1-64 | tr 'A-F' 'a-f')
          got=$(sha256sum AFAQY-Mail-Extractor-win64.zip | cut -d' ' -f1)
          [ ${#want} -eq 64 ] && [ "$want" = "$got" ] || { echo "checksum mismatch: release $want, file $got"; exit 1; }
          cd - > /dev/null
          echo "{\"tag\":\"$tag\"}" > _site/assets/extractor/latest.json
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
